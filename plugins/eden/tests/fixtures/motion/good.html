<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:sans-serif} section{height:900px;padding:40px;border-bottom:1px solid #ccc}
.box{width:120px;height:120px;background:#f97316}
@media (prefers-reduced-motion:no-preference){@supports (animation-timeline:view()){
.box{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 40%}}}
@keyframes rise{from{opacity:0;transform:translateX(-60px) scale(.8)}}
</style></head><body>
<h1>Good page</h1>
<section><div class="box"></div></section><section><div class="box"></div></section><section><div class="box"></div></section>
</body></html>
