<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Eden task lifecycle</title>
<desc id="d">A task starts with /eden:ignition-task (read the ticket, measure Figma, plan, approval, implement) and ends with /eden:turnoff-task (verify, test, audit, approval, commit, PR, close-out comment).</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="519" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="44" font-size="22" font-weight="750" fill="#111827" text-anchor="start">A task, end to end</text>
<text x="32" y="68" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">Two commands. Nothing is written, committed or published without your OK.</text>
<rect x="24" y="88" width="444" height="410" rx="14" fill="#ecfdf5" stroke="#86efac"/>
<text x="44" y="118" font-size="15" font-weight="700" fill="#15803d" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/eden:ignition-task  &lt;ticket-url&gt;</text>
<rect x="40" y="134" width="412" height="52" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
<circle cx="62" cy="156" r="11" fill="#15803d"/>
<text x="62" y="160.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="82" y="157" font-size="14" font-weight="650" fill="#15803d" text-anchor="start">Read the ticket</text>
<text x="82" y="175" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">description, subtasks, comments, attachments</text>
<rect x="40" y="194" width="412" height="52" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
<circle cx="62" cy="216" r="11" fill="#15803d"/>
<text x="62" y="220.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="82" y="217" font-size="14" font-weight="650" fill="#15803d" text-anchor="start">Measure the Figma</text>
<text x="82" y="235" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">per breakpoint, from the design cache</text>
<rect x="40" y="254" width="412" height="52" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
<circle cx="62" cy="276" r="11" fill="#15803d"/>
<text x="62" y="280.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="82" y="277" font-size="14" font-weight="650" fill="#15803d" text-anchor="start">Map the project</text>
<text x="82" y="295" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">conventions, reuse-first, blast radius</text>
<rect x="40" y="314" width="412" height="52" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
<circle cx="62" cy="336" r="11" fill="#15803d"/>
<text x="62" y="340.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="82" y="337" font-size="14" font-weight="650" fill="#15803d" text-anchor="start">Ask the base branch</text>
<text x="82" y="355" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">never assumed; branch named after the ticket</text>
<rect x="40" y="374" width="412" height="52" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<circle cx="62" cy="396" r="11" fill="#b45309"/>
<text x="62" y="400.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="82" y="397" font-size="14" font-weight="650" fill="#b45309" text-anchor="start">Propose the plan</text>
<text x="82" y="415" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">units, agents, security surface</text>
<rect x="314" y="386" width="124" height="26" rx="13" fill="#ffffff" stroke="#fcd34d"/>
<text x="376" y="403.5" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">waits for your OK</text>
<rect x="40" y="434" width="412" height="52" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
<circle cx="62" cy="456" r="11" fill="#15803d"/>
<text x="62" y="460.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="82" y="457" font-size="14" font-weight="650" fill="#15803d" text-anchor="start">Implement</text>
<text x="82" y="475" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Agents (fast model), measure → fix loop</text>
<rect x="492" y="88" width="444" height="410" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
<text x="512" y="118" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/eden:turnoff-task</text>
<rect x="508" y="134" width="412" height="52" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<circle cx="530" cy="156" r="11" fill="#1d4ed8"/>
<text x="530" y="160.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<text x="550" y="157" font-size="14" font-weight="650" fill="#1d4ed8" text-anchor="start">Verify completeness</text>
<text x="550" y="175" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">requirement by requirement, subtask by subtask</text>
<rect x="508" y="194" width="412" height="52" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<circle cx="530" cy="216" r="11" fill="#1d4ed8"/>
<text x="530" y="220.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
<text x="550" y="217" font-size="14" font-weight="650" fill="#1d4ed8" text-anchor="start">Tests in green</text>
<text x="550" y="235" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">visual 1:1 per breakpoint + code checks</text>
<rect x="508" y="254" width="412" height="52" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<circle cx="530" cy="276" r="11" fill="#1d4ed8"/>
<text x="530" y="280.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>
<text x="550" y="277" font-size="14" font-weight="650" fill="#1d4ed8" text-anchor="start">Audit the diff</text>
<text x="550" y="295" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">QA, design, security: critical/high block</text>
<rect x="508" y="314" width="412" height="52" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<circle cx="530" cy="336" r="11" fill="#b45309"/>
<text x="530" y="340.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">10</text>
<text x="550" y="337" font-size="14" font-weight="650" fill="#b45309" text-anchor="start">Final report</text>
<text x="550" y="355" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">what was tested and what was not</text>
<rect x="782" y="326" width="124" height="26" rx="13" fill="#ffffff" stroke="#fcd34d"/>
<text x="844" y="343.5" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">waits for your OK</text>
<rect x="508" y="374" width="412" height="52" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<circle cx="530" cy="396" r="11" fill="#1d4ed8"/>
<text x="530" y="400.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">11</text>
<text x="550" y="397" font-size="14" font-weight="650" fill="#1d4ed8" text-anchor="start">Commit · push · PR</text>
<text x="550" y="415" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">a PR to main/develop needs its own OK</text>
<rect x="508" y="434" width="412" height="52" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<circle cx="530" cy="456" r="11" fill="#1d4ed8"/>
<text x="530" y="460.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">12</text>
<text x="550" y="457" font-size="14" font-weight="650" fill="#1d4ed8" text-anchor="start">Close-out comment</text>
<text x="550" y="475" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">the only tracker comment, in English</text>
</svg>
