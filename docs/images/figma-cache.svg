<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Eden design cache</title>
<desc id="d">Paste a Figma link: if it is not cached it is measured once and saved; if it is cached, one read-only fingerprint call decides: same means the saved spec is used with no extraction; changed means only that node is re-measured and you get the list of changes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="399" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="44" font-size="22" font-weight="750" fill="#111827" text-anchor="start">Figma is measured once and remembered</text>
<text x="32" y="68" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">Figma is never modified: everything here only reads.</text>
<rect x="32" y="100" width="170" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="124" font-size="14" font-weight="650" fill="#111827" text-anchor="start">Figma link</text>
<text x="46" y="144" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">…?node-id=1062-23676</text>
<path d="M202,135 L230,135" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="232" y="100" width="170" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="246" y="124" font-size="14" font-weight="650" fill="#111827" text-anchor="start">In the cache?</text>
<text x="246" y="144" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">eden_design.py lookup</text>
<path d="M317,170 L317,238" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="317.0" y="197.0" font-size="12" font-weight="600" fill="#4b5563" text-anchor="middle">no</text>
<rect x="232" y="240" width="170" height="92" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="246" y="264" font-size="14" font-weight="650" fill="#1d4ed8" text-anchor="start">Measure once</text>
<text x="246" y="284" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">extract per breakpoint</text>
<text x="246" y="303" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">save spec + shots</text>
<text x="246" y="322" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">+ fingerprint</text>
<path d="M402,135 L450,135" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="426.0" y="128.0" font-size="12" font-weight="600" fill="#4b5563" text-anchor="middle">yes</text>
<rect x="452" y="100" width="196" height="70" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="466" y="124" font-size="14" font-weight="650" fill="#6d28d9" text-anchor="start">Fingerprint</text>
<text x="466" y="144" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">1 read-only call → 16 chars</text>
<text x="466" y="163" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">per node, no REST token</text>
<path d="M648,120 L690,104" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="662" y="100" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">same</text>
<rect x="692" y="76" width="244" height="66" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
<text x="706" y="100" font-size="14" font-weight="650" fill="#15803d" text-anchor="start">Same as saved</text>
<text x="706" y="120" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">use the cache — nothing re-read</text>
<path d="M648,152 L690,210" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="640" y="196" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">changed</text>
<rect x="692" y="180" width="244" height="118" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="706" y="204" font-size="14" font-weight="650" fill="#b45309" text-anchor="start">Re-measure only that node</text>
<text x="706" y="224" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">then report what changed:</text>
<text x="706" y="242" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">~ desktop · title 64 → 72 px</text>
<text x="706" y="260" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">+ new secondary button</text>
<text x="706" y="278" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">- removed 180 px button</text>
<text x="32" y="372" font-size="13" font-weight="500" fill="#4b5563" text-anchor="start">Live test (Scriptel · About Us, 4 frames): first pass ≈ 246k agent tokens · second pass = one call, all 4 “same”.</text>
</svg>
