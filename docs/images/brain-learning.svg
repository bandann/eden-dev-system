<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How the Eden brain learns</title>
<desc id="d">At session end, before compaction and on every git commit or push, the new part of the conversation is condensed and redacted, queued, and distilled by a read-only model that returns notes; the script validates and writes them: project notes directly, verified general learnings straight into the global brain.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="399" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="44" font-size="22" font-weight="750" fill="#111827" text-anchor="start">The brain learns on its own (optional)</text>
<text x="32" y="68" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">The model proposes, the code writes. Secrets and &lt;private&gt; never reach the model or a note.</text>
<rect x="32" y="96" width="170" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="120" font-size="14" font-weight="650" fill="#111827" text-anchor="start">Triggers</text>
<text x="46" y="140" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">session end</text>
<text x="46" y="159" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">before compaction</text>
<text x="46" y="178" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">git commit / push</text>
<path d="M202,152 L226,152" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="228" y="96" width="170" height="112" rx="12" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
<text x="242" y="120" font-size="14" font-weight="650" fill="#be123c" text-anchor="start">Condense</text>
<text x="242" y="140" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">redact secrets</text>
<text x="242" y="159" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">&lt;private&gt; → [PRIVATE]</text>
<text x="242" y="178" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">long sessions → parts</text>
<path d="M398,152 L422,152" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="424" y="96" width="170" height="112" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="438" y="120" font-size="14" font-weight="650" fill="#6d28d9" text-anchor="start">Distiller</text>
<text x="438" y="140" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">claude -p, read-only</text>
<text x="438" y="159" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">returns note blocks</text>
<text x="438" y="178" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">dedupes vs. brain</text>
<path d="M594,152 L618,152" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="620" y="96" width="170" height="112" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="634" y="120" font-size="14" font-weight="650" fill="#b45309" text-anchor="start">Validator</text>
<text x="634" y="140" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">safe paths only</text>
<text x="634" y="159" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">secret → quarantine</text>
<text x="634" y="178" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">all-or-nothing</text>
<path d="M790,130 L818,118" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M790,176 L818,236" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="820" y="86" width="116" height="70" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
<text x="834" y="110" font-size="14" font-weight="650" fill="#15803d" text-anchor="start">Project</text>
<text x="834" y="130" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">written directly</text>
<rect x="820" y="204" width="116" height="70" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
<text x="834" y="228" font-size="14" font-weight="650" fill="#15803d" text-anchor="start">General</text>
<text x="834" y="248" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">verified only</text>
<path d="M878,274 L878,300" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="752" y="302" width="184" height="70" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
<text x="766" y="326" font-size="14" font-weight="650" fill="#15803d" text-anchor="start">Global brain</text>
<text x="766" y="346" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">written directly</text>
<rect x="32" y="262" width="560" height="110" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
<text x="46" y="286" font-size="14" font-weight="650" fill="#15803d" text-anchor="start">Next session starts with it</text>
<text x="46" y="306" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">Your working style, the global knowledge index and this project's notes are loaded</text>
<text x="46" y="325" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">as context — treated as memory, verified against the repo before acting on it.</text>
<text x="46" y="344" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">A queue item leaves only when its notes were really written.</text>
<path d="M750,337 L594,317" fill="none" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>
