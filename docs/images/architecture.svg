<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Eden architecture</title>
<desc id="d">You talk to a session on the strong model that plans and decides; specialist agents on the fast model do bounded work; rules (agnostic core plus stack modules) shape everything; hooks load rules, run the optional brain and guard secrets and Figma; integrations are the tracker, Figma Console, Playwright and git.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="659" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="44" font-size="22" font-weight="750" fill="#111827" text-anchor="start">How Eden is built</text>
<text x="32" y="68" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">Strong model plans and decides · fast model executes · rules shape both · hooks keep it safe</text>
<rect x="32" y="88" width="660" height="56" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="112" font-size="14" font-weight="650" fill="#111827" text-anchor="start">You</text>
<text x="46" y="132" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">Type /eden:go &lt;what you want&gt; or call a command by name</text>
<path d="M362,144 L362,162" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="32" y="164" width="660" height="78" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
<text x="46" y="188" font-size="14" font-weight="650" fill="#15803d" text-anchor="start">Lead session — strong model</text>
<text x="46" y="208" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">Understands the ticket and the design · decides scope and the reuse-first rung</text>
<text x="46" y="227" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">Plans with you, delegates, verifies every agent report · /eden:shopify leads the Shopify team</text>
<path d="M362,242 L362,260" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="32" y="262" width="660" height="196" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="46" y="286" font-size="14" font-weight="650" fill="#1d4ed8" text-anchor="start">Specialists — 55 agents, fast model, one closed task each</text>
<text x="46" y="306" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">explorer · figma-extractor · implementer · design-auditor · qa-reviewer · security-auditor</text>
<text x="46" y="325" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">Shopify team: architect · devops · design-system · theme-dev · js-dev · data · perf-seo-a11y</text>
<text x="46" y="344" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">WordPress: wp-explorer · wp-implementer · wp-qa-reviewer · wp-migrator</text>
<text x="46" y="363" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">React: architect · ui-dev · data-dev · tester · devops · qa-reviewer</text>
<text x="46" y="382" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">PHP · Laravel: architect · dev · data-dev · tester · devops · qa-reviewer</text>
<text x="46" y="401" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">Node · Express · NestJS: architect · dev · data-dev · tester · devops · qa-reviewer</text>
<text x="46" y="420" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">Mobile: architect · ui-dev · native-dev · data-dev · tester · devops · qa-reviewer</text>
<text x="46" y="439" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">Shopify apps: architect · admin-dev · backend-dev · extension-dev · tester · devops · qa</text>
<rect x="32" y="474" width="660" height="78" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="46" y="498" font-size="14" font-weight="650" fill="#6d28d9" text-anchor="start">Rules — what “done right” means</text>
<text x="46" y="518" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">Agnostic core: workflow, reuse-first, design, quality, testing, security, git, tracker, memory</text>
<text x="46" y="537" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">Stack modules: Shopify themes · Shopify apps · WordPress · React · PHP · Node · Mobile</text>
<rect x="712" y="88" width="216" height="464" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="726" y="112" font-size="14" font-weight="650" fill="#b45309" text-anchor="start">Hooks (automatic)</text>
<text x="728" y="150" font-size="13" font-weight="700" fill="#b45309" text-anchor="start">Session start</text>
<text x="728" y="168" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">loads your rules + the kit's</text>
<text x="728" y="200" font-size="13" font-weight="700" fill="#b45309" text-anchor="start">Brain (optional)</text>
<text x="728" y="218" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">learns from sessions,</text>
<text x="728" y="236" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">commits and pushes</text>
<text x="728" y="268" font-size="13" font-weight="700" fill="#b45309" text-anchor="start">Secret guard</text>
<text x="728" y="286" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">blocks commits / pushes</text>
<text x="728" y="304" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">that carry a secret</text>
<text x="728" y="336" font-size="13" font-weight="700" fill="#b45309" text-anchor="start">Figma guard</text>
<text x="728" y="354" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Figma is read-only:</text>
<text x="728" y="372" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">every write is blocked</text>
<text x="32" y="584" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Integrations</text>
<rect x="32" y="598" width="179" height="24" rx="12.0" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="121.5" y="612.5" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">Asana · SMG Hub · ClickUp</text>
<rect x="221" y="598" width="179" height="24" rx="12.0" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="310.5" y="612.5" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">Figma Console (read-only)</text>
<rect x="410" y="598" width="83" height="24" rx="12.0" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="451.5" y="612.5" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">Playwright</text>
<rect x="503" y="598" width="96" height="24" rx="12.0" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="551.0" y="612.5" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">git · GitHub</text>
<rect x="609" y="598" width="210" height="24" rx="12.0" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="714.0" y="612.5" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">Graphify + Obsidian (optional)</text>
</svg>
